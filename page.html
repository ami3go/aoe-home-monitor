<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서버 모니터링</title>
<style>
  :root { --bg: #0f1115; --fg: #e6e6e6; --muted: #9aa0a6; --line: #2a2f37; --card: #161a20;
          --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--background, var(--bg)); color: var(--foreground, var(--fg));
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card.down { border-color: var(--bad); }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; }
  .nums div { font-size: 12px; color: var(--muted); }
  .nums b { display: block; font-size: 18px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok) !important; } .warn { color: var(--warn) !important; } .bad { color: var(--bad) !important; }
  svg { width: 100%; height: 34px; display: block; }
  .label { font-size: 11px; color: var(--muted); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; }
  h2 { font-size: 15px; margin: 24px 0 4px; }
  .empty { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<h1>서버 모니터링</h1>
<div class="sub" id="sub">불러오는 중…</div>
<div class="grid" id="grid"></div>
<h2>구독 사용량</h2>
<div class="sub">서버마다 그 서버에 로그인된 계정과 사용량입니다. 같은 계정이면 사용량을 더하지 않습니다.</div>
<table><thead id="subs-head"><tr><th>서비스</th><th>요금제</th><th>창</th><th>쓰는 서버</th></tr></thead><tbody id="subs"></tbody></table>
<script>
(() => {
  let next = 0;
  const pending = new Map();
  const { port1, port2 } = new MessageChannel();
  port1.onmessage = ({ data: m }) => {
    if (m.event === "theme") {
      for (const [k, v] of Object.entries(m.data.cssVars || {})) document.documentElement.style.setProperty(k, String(v));
      return;
    }
    if (m.event) return;
    const done = pending.get(m.id); pending.delete(m.id);
    if (done) done(m);
  };
  const request = (msg, post) => {
    const id = ++next;
    const reply = new Promise((resolve, reject) => pending.set(id, (m) => (m.error ? reject(m.error) : resolve(m.result))));
    post({ aoeBridge: 1, id, ...msg });
    return reply;
  };
  const call = (method, params) => request({ method, params }, (m) => port1.postMessage(m));
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const level = (v, warn = 80, bad = 92) => v == null ? "" : v >= bad ? "bad" : v >= warn ? "warn" : "ok";
  const fmt = (v) => v == null ? "-" : `${Math.round(v)}%`;
  const NS = "http://www.w3.org/2000/svg";
  function spark(values) {
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 100 34"); svg.setAttribute("preserveAspectRatio", "none");
    const vals = values.length ? values : [0];
    const step = vals.length > 1 ? 100 / (vals.length - 1) : 100;
    const pts = vals.map((v, i) => `${(i * step).toFixed(2)},${(33 - Math.min(100, v) * 0.32).toFixed(2)}`).join(" ");
    const line = document.createElementNS(NS, "polyline");
    line.setAttribute("points", pts); line.setAttribute("fill", "none");
    line.setAttribute("stroke", "var(--accent)"); line.setAttribute("stroke-width", "1.2");
    line.setAttribute("vector-effect", "non-scaling-stroke");
    svg.append(line);
    return svg;
  }
  function render(state) {
    const grid = document.getElementById("grid"), subs = document.getElementById("subs");
    grid.replaceChildren(); subs.replaceChildren();
    if (!state) { document.getElementById("sub").textContent = "아직 측정값이 없습니다."; return; }
    if (state.error) { document.getElementById("sub").textContent = `수집기 오류: ${state.error}`; return; }
    const up = state.hosts.filter((h) => h.up).length;
    document.getElementById("sub").textContent = `서버 ${up}/${state.hosts.length} 연결 · 갱신 ${state.updated} · 그래프는 최근 24시간(15분 평균)`;
    for (const h of state.hosts) {
      const card = el("div", h.up ? "card" : "card down");
      const head = el("div", "head");
      head.append(el("span", "name", h.name), el("span", "meta", h.up ? `${h.os || ""} · ${h.cores || "?"}코어` : "연결 끊김"));
      card.append(head);
      if (!h.up) { card.append(el("div", "meta bad", h.error || "측정값 없음")); grid.append(card); continue; }
      const nums = el("div", "nums");
      for (const [label, v, w, b] of [["CPU", h.cpu, 80, 92], ["메모리", h.mem, 80, 92], ["디스크", h.disk, 85, 95]]) {
        const d = el("div", null, label); const n = el("b", level(v, w, b), fmt(v)); d.append(n); nums.append(d);
      }
      card.append(nums, spark(h.cpuSeries), el("div", "label", "CPU"), spark(h.memSeries), el("div", "label", "메모리"));
      grid.append(card);
    }
    if (state.usage && state.usage.length) {
      const NAMES = { codex: "Codex", claude: "Claude", grok: "Grok", antigravity: "Antigravity", kimi: "Kimi", opencode: "OpenCode" };
      const STATUS = { logged_in: "로그인됨 · 사용량 미확인", expired: "토큰 만료", failed: "조회 실패", unknown: "확인 불가" };
      const head = document.getElementById("subs-head");
      head.replaceChildren();
      const hr = el("tr");
      for (const h of ["서버", "서비스", "요금제", "계정", "사용량"]) hr.append(el("th", null, h));
      head.append(hr);
      for (const host of state.usage) {
        const providers = host.providers || [];
        if (!providers.length) { const tr = el("tr"); tr.append(el("td", null, host.host), el("td", "meta", host.error || "로그인된 구독 없음")); subs.append(tr); }
        for (const p of providers) {
          const windows = (p.windows || []).filter((w) => typeof w.used === "number");
          const top = windows.length ? Math.max(...windows.map((w) => w.used)) : null;
          const tr = el("tr");
          const usageCell = el("td", top == null ? (p.status === "expired" || p.status === "failed" ? "bad" : "meta") : level(top, 70, 90),
            windows.length ? windows.map((w) => `${w.label} ${Math.round(w.used)}%`).join(" · ") : (STATUS[p.status] || p.status));
          if (p.reason) usageCell.title = p.reason;
          tr.append(el("td", null, host.host), el("td", null, NAMES[p.tool] || p.tool), el("td", null, p.plan || "-"),
            el("td", "meta", p.account || "-"), usageCell);
          subs.append(tr);
        }
      }
      return;
    }
    for (const s of state.subscriptions || []) {
      const tr = el("tr");
      tr.append(el("td", null, s.tool), el("td", null, s.plan || "-"),
        el("td", null, (s.windows || []).map((w) => `${w.label} ${w.usedPercent ?? "?"}%`).join(" · ") || "-"),
        el("td", "meta", (s.hosts || []).join(", ")));
      subs.append(tr);
    }
    if (!(state.subscriptions || []).length) { const tr = el("tr"); tr.append(el("td", "empty", "확인된 구독이 없습니다.")); subs.append(tr); }
  }
  async function load() {
    try {
      const body = await call("plugins.uiState");
      const entries = Array.isArray(body) ? body : body.entries || body.items || body.states || [];
      const mine = entries.find((e) => e.plugin_id === "dev.hyunwook.home-monitor" && e.slot === "page" && e.id === "monitor");
      render(mine ? mine.payload : null);
    } catch (err) {
      document.getElementById("sub").textContent = `불러오지 못했습니다: ${err.message || err.code || err}`;
    }
  }
  request({ method: "ready", params: { nonce: location.hash.slice(1) } }, (m) => parent.postMessage(m, "*", [port2]))
    .then(load);
  setInterval(load, 30000);
})();
</script>
</body>
</html>
