# Home Monitor: server health and subscription usage for the Home AI fleet, in the AoE dashboard.
id = "dev.hyunwook.home-monitor"
name = "Home Monitor"
version = "0.9.1"
api_version = 16
aoe_version = ">=1.20.0, <2.0.0"
description = "홈서버 전체의 CPU·메모리·디스크 상태와 구독 사용량을 대시보드 패널과 페이지로 보여줍니다."

# net: reads the collector's dashboard JSON. process.spawn: optional usage_command. fs.write: dashboard layout in ~/.cache/home-ai. session.read: the page reads its pushed state through the bridge.
capabilities = ["runtime.worker", "net", "session.read", "process.spawn", "fs.write"]

[[commands]]
id = "refresh"
title = "Home Monitor: 지금 새로고침"

[[settings]]
key = "source_url"
label = "수집기 주소"
description = "서버 측정값을 돌려주는 JSON 주소 (Home AI Office 수집기)."
type = "string"
default = "http://127.0.0.1:4317/api/dashboard?range=24h"

[[settings]]
key = "usage_command"
label = "서버별 구독 사용량 명령 (선택)"
description = "{\"hosts\": [{\"host\", \"providers\": [{\"tool\", \"plan\", \"account\", \"status\", \"windows\": [{\"label\", \"used\"}]}]}]} JSON을 출력하는 명령. 비우면 수집기의 구독 정보를 씁니다."
type = "string"
default = ""

[[settings]]
key = "vpn_command"
label = "VPN 상태 명령 (선택)"
description = "state: CONNECTED (이름) / started: / expires: / route IP -> 인터페이스 줄을 출력하는 명령. 연결되면 0으로 끝납니다."
type = "string"
default = ""

[[settings]]
key = "wake_hosts"
label = "켜기 버튼을 보일 서버"
description = "수집기의 서버 id. 꺼져 있으면 대시보드에 켜기 버튼이 생깁니다."
type = "string_list"

[[settings]]
key = "wake_command"
label = "켜기 명령"
description = "{host} 자리에 서버 id가 들어갑니다. 예: ~/.local/bin/home-wake {host}"
type = "string"
default = ""

[[settings]]
key = "power_command"
label = "스마트 멀티탭 상태 명령 (선택)"
description = "switch, power_w, today_wh, month_wh, history를 담은 JSON을 출력하는 명령"
type = "string"
default = ""

[[settings]]
key = "power_switch_command"
label = "스마트 멀티탭 켜기·끄기 명령 (선택)"
description = "{action} 자리에 on 또는 off가 들어갑니다. 예: ~/.local/bin/home-power {action}"
type = "string"
default = ""

[[settings]]
key = "refresh_secs"
label = "갱신 주기(초)"
type = "integer"
default = 60
min = 15
max = 3600

[[ui]]
slot = "home-pane"
id = "servers"

[[ui]]
slot = "page"
id = "dashboard"
title = "대시보드"
icon = "layout-dashboard"
entry = "dashboard.html"

[[ui]]
slot = "page"
id = "monitor"
title = "서버 모니터링"
icon = "activity"
entry = "page.html"

[[ui]]
slot = "page"
id = "history"
title = "서버 기록"
icon = "calendar-clock"
entry = "history.html"

[[ui]]
slot = "page"
id = "subscriptions"
title = "구독 사용량"
icon = "gauge"
entry = "subscriptions.html"

[runtime]
kind = "command"
command = [".aoe-build/worker"]

[[runtime.build]]
command = ["sh", "-c", "mkdir -p .aoe-build && printf '#!/bin/sh\\nexec %s \"$(dirname \"$0\")/../worker.py\"\\n' \"$(command -v python3)\" > .aoe-build/worker && chmod +x .aoe-build/worker"]
platforms = ["linux", "macos"]
