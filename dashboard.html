<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="대시보드">대시보드</title>
<style>
  :root { --bg: #0f1115; --fg: #e6e6e6; --muted: #9aa0a6; --line: #2a2f37; --card: #161a20;
          --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff; --accent2: #d2a8ff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--background, var(--bg)); color: var(--foreground, var(--fg));
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 24px 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card.down { border-color: var(--bad); }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; }
  .nums div { font-size: 12px; color: var(--muted); }
  .nums b { display: block; font-size: 18px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok) !important; } .warn { color: var(--warn) !important; } .bad { color: var(--bad) !important; }
  svg { width: 100%; height: 34px; display: block; }
  .label { font-size: 11px; color: var(--muted); margin: 2px 0 6px; display: flex; justify-content: space-between; }
  .section { font-size: 12px; color: var(--muted); margin: 10px 0 4px; border-top: 1px solid var(--line); padding-top: 8px; }
  .disk { margin: 6px 0; font-size: 12px; }
  .disk .row { display: flex; justify-content: space-between; gap: 8px; }
  .disk .mount { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .bar span { display: block; height: 100%; background: var(--ok); }
  .bar span.warn { background: var(--warn); } .bar span.bad { background: var(--bad); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
<style>
  html, body { height: auto; }
  .bar-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .bar-top .grow { flex: 1; }
  .chip { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px;
          font: inherit; font-size: 12px; cursor: pointer; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .board { display: grid; gap: 12px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
  .board.cols-1 { grid-template-columns: 1fr; }
  .board.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .board.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 820px) { .board.cols-2, .board.cols-3 { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column;
           max-height: calc(100vh - 90px); min-height: 160px; }
  .panel.fit { max-height: none; }
  .panel.wide { grid-column: span 2; }
  .board.cols-1 .panel.wide { grid-column: auto; }
  @media (max-width: 820px) { .panel.wide { grid-column: auto; } }
  .panel header { cursor: grab; user-select: none; }
  .panel.dragging { opacity: .45; }
  .panel.over { outline: 2px dashed var(--accent); outline-offset: 2px; }
  .grip { color: var(--muted); margin-right: 6px; }
  .panel header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); gap: 8px; }
  .panel header b { font-size: 14px; }
  .panel .body { overflow: auto; padding: 8px 12px 12px; }
  .host { margin: 8px 0 12px; }
  .host h3 { font-size: 12px; letter-spacing: .04em; color: var(--muted); margin: 0 0 4px; display: flex; justify-content: space-between; text-transform: uppercase; }
  .row { display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 6px; font-size: 13px; }
  .row.link { cursor: pointer; }
  .row.link:hover { background: rgba(127,127,127,.12); }
  .row .tool { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); font-size: 11px; min-width: 76px; }
  .row .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .st { font-size: 12px; white-space: nowrap; }
  .tiles { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .tile.down { border-color: var(--bad); }
  .tile.vpn { margin-bottom: 8px; }
  .tile.vpn.on { border-color: var(--ok); }
  .tile .t { display: flex; justify-content: space-between; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .kv { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .kv { gap: 6px; align-items: baseline; }
  .kv b { color: var(--fg); font-weight: 600; min-width: 34px; text-align: right; }
  .kv .amount { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mountname { font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .mountname + .kv .amount { margin-left: 0; }
  .mini { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 2px 0 5px; }
  .mini span { display: block; height: 100%; background: var(--ok); }
  .mini span.warn { background: var(--warn); } .mini span.bad { background: var(--bad); }
  .sub-row { display: grid; grid-template-columns: 90px 1fr auto; gap: 8px; font-size: 12px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .sub-row:last-child { border-bottom: 0; }
  .muted { color: var(--muted); }
  .tool-row { border-bottom: 1px solid var(--line); padding: 6px 0; }
  .tool-row:last-child { border-bottom: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--fg); }
  .pill.warn { border-color: var(--warn); color: var(--warn); }
  .pill.skill { color: var(--muted); }
  details summary { cursor: pointer; font-size: 12px; }
  /* Host names: OS logo + bold coloured name so each server stands out from the numbers below it. */
  .os-darwin { --hc: #8b5cf6; } .os-linux { --hc: #d97706; } .os-windows { --hc: #0ea5e9; } .os-unknown { --hc: var(--muted); }
  .hname { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 700; color: var(--hc, var(--fg));
           letter-spacing: 0; text-transform: none; }
  .hname svg { width: 18px; height: 18px; flex: none; display: inline-block; }
  .host h3 { align-items: center; text-transform: none; letter-spacing: 0; margin-bottom: 6px; padding-bottom: 4px;
             border-bottom: 2px solid var(--hc, var(--line)); }
  .tile[class*="os-"] { border-left: 4px solid var(--hc); }
  .tile .t { align-items: center; }
</style>
<div class="bar-top">
  <h1 style="margin:0" data-i18n="대시보드">대시보드</h1><span class="sub" id="sub" style="margin:0" data-i18n="불러오는 중…">불러오는 중…</span><span class="grow"></span>
  <span class="muted" style="font-size:12px" data-i18n="보이기">보이기</span><span id="toggles"></span>
  <span class="muted" style="font-size:12px" data-i18n="열">열</span><span id="cols"></span>
</div>
<div class="board" id="board"></div>
<script>
// Worker-selected language; all display data stays text, never HTML.
let language = "ko", messages = {};
function translate(source, values = {}) {
  const text = language === "en" ? (messages[source] ?? source) : source;
  return String(text).replace(/\{(p\d+)\}/g, (match, key) => Object.hasOwn(values, key) ? String(values[key]) : match);
}
function setLocale(entries) {
  const settings = entries.find((e) => e.plugin_id === "dev.hyunwook.home-monitor" && e.slot === "page" && e.id === "dashboard")?.payload;
  language = settings?.language === "en" ? "en" : "ko";
  messages = settings?.messages || {};
  document.documentElement.lang = language;
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = translate(node.dataset.i18n);
}
</script>
<script>
function PANELS() { return [["sessions", translate("세션")], ["servers", translate("서버 상태")], ["subs", translate("구독 상태")], ["tools", translate("도구")], ["programs", translate("프로그램")]]; }
function COLS() { return [["auto", translate("자동")], ["1", "1"], ["2", "2"], ["3", "3"]]; }
const STATUS_TONE = { "실행 중": "", "입력 대기": "warn", "오류": "bad", "유휴": "muted" };
const NAMES = { codex: "Codex", claude: "Claude", grok: "Grok", antigravity: "Antigravity", kimi: "Kimi", opencode: "OpenCode" };

const normalize = () => {
  prefs.hidden = prefs.hidden || []; prefs.wide = prefs.wide || []; prefs.cols = prefs.cols || "auto";
  const ids = PANELS().map((p) => p[0]); prefs.order = (prefs.order || []).filter((x) => ids.includes(x));
  for (const id of ids) if (!prefs.order.includes(id)) prefs.order.push(id);
};
normalize();
let serverLayoutApplied = false;
// Saved twice: in this browser when allowed, and by the plugin worker so every browser gets the same layout.
const save = () => {
  try { localStorage.setItem("aoe-home-dashboard", JSON.stringify(prefs)); } catch {}
  bridgeCall("action", { method: "layout_save", params: { order: prefs.order, hidden: prefs.hidden, wide: prefs.wide, cols: prefs.cols } }).catch(() => {});
};
let last = [];
function bytes(v, rate) {
  if (v == null) return "-";
  const u = ["B", "KB", "MB", "GB", "TB", "PB"]; let i = 0;
  while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
  return `${v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)} ${u[i]}${rate ? "/s" : ""}`;
}
function chips() {
  const t = document.getElementById("toggles"); t.replaceChildren();
  for (const [id, label] of PANELS()) {
    const b = el("button", prefs.hidden.includes(id) ? "chip" : "chip on", label);
    b.onclick = () => { prefs.hidden = prefs.hidden.includes(id) ? prefs.hidden.filter((x) => x !== id) : [...prefs.hidden, id]; save(); render(last); };
    t.append(b, document.createTextNode(" "));
  }
  const c = document.getElementById("cols"); c.replaceChildren();
  for (const [v, label] of COLS()) {
    const b = el("button", prefs.cols === v ? "chip on" : "chip", label);
    b.onclick = () => { prefs.cols = v; save(); render(last); };
    c.append(b, document.createTextNode(" "));
  }
}
let dragging = null;
function panel(id, title, right) {
  const p = el("section", "panel" + (prefs.wide.includes(id) ? " wide" : "")); p.dataset.id = id;
  const h = el("header"); h.draggable = true; h.title = translate("끌어서 순서를 바꿉니다");
  const grip = el("span", "grip", "⠿");
  const wide = el("button", "chip", prefs.wide.includes(id) ? translate("좁게") : translate("넓게"));
  wide.onclick = (e) => { e.stopPropagation(); prefs.wide = prefs.wide.includes(id) ? prefs.wide.filter((x) => x !== id) : [...prefs.wide, id]; save(); render(last); };
  const left = el("span"); left.append(grip, el("b", null, title));
  const tools = el("span"); tools.append(el("span", "muted", (right || "") + " "), wide);
  h.append(left, tools);
  h.addEventListener("dragstart", (e) => { dragging = id; p.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", id); } catch {} });
  h.addEventListener("dragend", () => { dragging = null; p.classList.remove("dragging"); document.querySelectorAll(".panel.over").forEach((x) => x.classList.remove("over")); });
  p.addEventListener("dragover", (e) => { if (dragging && dragging !== id) { e.preventDefault(); p.classList.add("over"); } });
  p.addEventListener("dragleave", () => p.classList.remove("over"));
  p.addEventListener("drop", (e) => {
    e.preventDefault(); p.classList.remove("over");
    if (!dragging || dragging === id) return;
    const order = prefs.order.filter((x) => x !== dragging);
    const rect = p.getBoundingClientRect();
    const after = (e.clientY - rect.top > rect.height / 2) || (e.clientX - rect.left > rect.width / 2 && rect.height < 400);
    order.splice(order.indexOf(id) + (after ? 1 : 0), 0, dragging);
    prefs.order = order; save(); render(last);
  });
  const body = el("div", "body"); p.append(h, body);
  return [p, body];
}
function sessionsPanel(entries) {
  const fleet = entries.find((e) => e.plugin_id === "dev.hyunwook.fleet" && e.slot === "page" && e.id === "sessions")
    || entries.find((e) => e.plugin_id === "dev.hyunwook.fleet" && e.slot === "home-pane");
  const sections = (fleet?.payload?.blocks || []).filter((b) => b.kind === "section");
  const total = sections.reduce((n, s) => n + (s.children || []).filter((c) => c.kind === "row").length, 0);
  const [p, body] = panel("sessions", translate("세션"), fleet ? translate("{p0} · 세션 {p1}개", {p0: fleet.payload.footer?.value || "", p1: total}) : translate("Fleet 플러그인 없음"));
  const alert = (fleet?.payload?.blocks || []).find((b) => b.kind === "callout");
  if (alert) body.append(el("div", "row warn", `${alert.title} — ${alert.detail || ""}`));
  for (const s of sections) {
    const box = el("div", "host");
    box.append(hostHead(s.title, null, s.value || (s.badges || []).map((b) => b.text).join(" · "), s.value_tone === "danger" ? "bad" : "muted"));
    for (const c of s.children || []) {
      if (c.kind === "note") { box.append(el("div", "row muted", c.text)); continue; }
      const r = el("div", c.href ? "row link" : "row");
      r.append(el("span", "tool", c.prefix || ""), el("span", "title", c.label || ""), el("span", "st " + (STATUS_TONE[c.value] || ""), translate(c.value || "")));
      const m = /^\/session\/([^/?#]+)/.exec(c.href || "");

function twoPress(key, idle, armedLabel, fire) {

  const btn = el("button", "chip on", isArmed ? armedLabel : idle);
  btn.onclick = (e) => {
    e.stopPropagation();
    if (!(window.armed[key] && Date.now() < window.armed[key])) {
      window.armed[key] = Date.now() + 5000; btn.textContent = armedLabel; setTimeout(() => render(last), 5100); return;
    }
    window.armed[key] = 0; btn.disabled = true; btn.textContent = translate("보내는 중…");
    fire().then(() => setTimeout(reloadSoon, 4000)).catch((err) => { btn.disabled = false; btn.textContent = translate("실패: {p0}", {p0: err.message || err.code || err}); });
  };

}
function serversPanel(entries) {
  const mon = entries.find((e) => e.plugin_id === "dev.hyunwook.home-monitor" && e.slot === "page" && e.id === "monitor")?.payload;
  const hosts = mon?.hosts || [];
  const up = hosts.filter((h) => h.up).length;
  const [p, body] = panel("servers", translate("서버 상태"), mon ? translate("서버 {p0}/{p1} · {p2}", {p0: up, p1: hosts.length, p2: mon.updated || ""}) : "");

    const on = pw.switch === "on";

    const head = el("div", "t");
    head.append(el("span", null, translate("멀티탭 · {p0}", {p0: pw.label || ""})), el("span", pw.error ? "bad" : on ? "ok" : "muted", pw.error ? translate("확인 불가") : !pw.online ? translate("오프라인") : on ? translate("켜짐") : translate("꺼짐")));
    box.append(head);
    if (pw.error) box.append(el("div", "muted", pw.error));

      const kv = el("div", "kv"); kv.append(el("span", null, translate("지금 전력")), el("b", null, `${pw.power_w ?? "-"} W`)); box.append(kv);
      const kv2 = el("div", "kv"); kv2.append(el("span", null, translate("오늘 / 이번 달")), el("span", "amount", `${(pw.today_wh / 1000).toFixed(2)} kWh / ${(pw.month_wh / 1000).toFixed(2)} kWh`)); box.append(kv2);

<script>
(() => {
  let next = 0;
  const pending = new Map();
  const { port1, port2 } = new MessageChannel();
  port1.onmessage = ({ data: m }) => {
    if (m.event === "theme") {
      for (const [k, v] of Object.entries(m.data.cssVars || {})) document.documentElement.style.setProperty(k, String(v));
      return;
    }
    if (m.event) return;
    const done = pending.get(m.id); pending.delete(m.id);

  };
  const request = (msg, post) => {
    const id = ++next;
    const reply = new Promise((resolve, reject) => pending.set(id, (m) => (m.error ? reject(m.error) : resolve(m.result))));

    }

  setInterval(load, 15000);
