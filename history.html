<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="서버 기록">서버 기록</title>
<style>
  :root { --bg: #0f1115; --fg: #e6e6e6; --muted: #9aa0a6; --line: #2a2f37; --card: #161a20;
          --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff; --accent2: #d2a8ff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--background, var(--bg)); color: var(--foreground, var(--fg));
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 24px 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card.down { border-color: var(--bad); }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; }
  .nums div { font-size: 12px; color: var(--muted); }
  .nums b { display: block; font-size: 18px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok) !important; } .warn { color: var(--warn) !important; } .bad { color: var(--bad) !important; }
  svg { width: 100%; height: 34px; display: block; }
  .label { font-size: 11px; color: var(--muted); margin: 2px 0 6px; display: flex; justify-content: space-between; }
  .section { font-size: 12px; color: var(--muted); margin: 10px 0 4px; border-top: 1px solid var(--line); padding-top: 8px; }
  .disk { margin: 6px 0; font-size: 12px; }
  .disk .row { display: flex; justify-content: space-between; gap: 8px; }
  .disk .mount { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .bar span { display: block; height: 100%; background: var(--ok); }
  .bar span.warn { background: var(--warn); } .bar span.bad { background: var(--bad); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
<style>
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .controls button { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
                     padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .controls button.on { border-color: var(--accent); color: var(--accent); }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
  .chart svg { height: 120px; }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .legend { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .legend i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin: 0 4px 0 10px; }
  .heat { display: grid; grid-template-columns: 34px repeat(24, 1fr); gap: 2px; font-size: 10px; color: var(--muted); }
  .heat div.c { height: 18px; border-radius: 2px; }
  .two { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
</style>
<h1 data-i18n="서버 기록">서버 기록</h1>
<div class="sub" id="sub" data-i18n="불러오는 중…">불러오는 중…</div>
<div class="controls" id="hosts"></div>
<div class="controls" id="ranges"></div>
<div class="charts" id="charts"></div>
<h2 data-i18n="언제 많이 쓰나 — 요일 × 시간대 평균">언제 많이 쓰나 — 요일 × 시간대 평균</h2>
<div class="controls" id="metrics"></div>
<div class="card"><div class="heat" id="heat"></div><div class="meta" id="heatnote" style="margin-top:6px"></div></div>
<div class="two">
  <div><h2 data-i18n="CPU가 가장 높았던 시간">CPU가 가장 높았던 시간</h2><table><thead><tr><th data-i18n="시간">시간</th><th data-i18n="CPU 최고">CPU 최고</th><th data-i18n="CPU 평균">CPU 평균</th><th data-i18n="메모리">메모리</th></tr></thead><tbody id="peaks"></tbody></table></div>
  <div><h2 data-i18n="네트워크를 가장 많이 쓴 시간">네트워크를 가장 많이 쓴 시간</h2><table><thead><tr><th data-i18n="시간">시간</th><th data-i18n="받기">받기</th><th data-i18n="보내기">보내기</th></tr></thead><tbody id="net"></tbody></table></div>
</div>
<h2 id="rowsTitle" data-i18n="기간별 요약">기간별 요약</h2>
<table><thead><tr><th data-i18n="시간">시간</th><th data-i18n="CPU 평균/최고">CPU 평균/최고</th><th data-i18n="메모리 평균/최고">메모리 평균/최고</th><th data-i18n="디스크 최고">디스크 최고</th><th data-i18n="받기">받기</th><th data-i18n="보내기">보내기</th><th data-i18n="응답">응답</th></tr></thead><tbody id="rows"></tbody></table>
<script>
// Worker-selected language; all display data stays text, never HTML.
let language = "ko", messages = {};
function translate(source, values = {}) {
  const text = language === "en" ? (messages[source] ?? source) : source;
  return String(text).replace(/\{(p\d+)\}/g, (match, key) => Object.hasOwn(values, key) ? String(values[key]) : match);
}
function setLocale(entries) {
  const settings = entries.find((e) => e.plugin_id === "dev.hyunwook.home-monitor" && e.slot === "page" && e.id === "dashboard")?.payload;
  language = settings?.language === "en" ? "en" : "ko";
  messages = settings?.messages || {};
  document.documentElement.lang = language;
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = translate(node.dataset.i18n);
}
</script>
<script>
const PAGE_ID = "history";
function RANGES() { return [["24h", translate("24시간")], ["7d", translate("7일")], ["30d", translate("30일")], ["90d", translate("90일")]]; }
function DOW() { return [translate("일"), translate("월"), translate("화"), translate("수"), translate("목"), translate("금"), translate("토")]; }
const NS = "http://www.w3.org/2000/svg";
let state = null, metric = "cpuAvg", busy = false;
function bytes(v, rate) {
  if (v == null) return "-";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
  return `${v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)} ${u[i]}${rate ? "/s" : ""}`;
}
function when(ms, daily) {
  const d = new Date(ms); const p = (n) => String(n).padStart(2, "0");
  const day = `${d.getMonth() + 1}/${d.getDate()}(${DOW()[d.getDay()]})`;
  return daily ? day : `${day} ${p(d.getHours())}:00`;
}
async function select(change) {
  if (busy) return; busy = true;
  document.getElementById("sub").textContent = translate("불러오는 중…");
  try { await bridgeCall("action", { method: "history_select", params: { host: state?.host, range: state?.range, ...change } }); } catch (e) {}
  setTimeout(() => { busy = false; reload(); }, 1500);
}
function buttons(id, items, current, onClick) {
  const box = document.getElementById(id); box.replaceChildren();
  for (const [value, label] of items) {
    const b = el("button", value === current ? "on" : null, label);
    b.onclick = () => onClick(value); box.append(b);
  }
}
function chart(title, series, opts = {}) {
  const box = el("div", "card chart");
  const legend = el("div", "legend"); legend.append(el("b", null, title));
  for (const s of series) { const i = el("i"); i.style.background = s.color; legend.append(i, document.createTextNode(s.label)); }
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 100 40"); svg.setAttribute("preserveAspectRatio", "none");
  const pts = state.points || [];
  const top = opts.max || Math.max(1, ...series.flatMap((s) => pts.map((p) => p[s.key] || 0)));
  for (const s of series) {
    const vals = pts.map((p) => p[s.key]);
    const step = vals.length > 1 ? 100 / (vals.length - 1) : 100;
    const line = document.createElementNS(NS, "polyline");
    line.setAttribute("points", vals.map((v, i) => `${(i * step).toFixed(2)},${(39 - Math.min(top, v || 0) / top * 38).toFixed(2)}`).join(" "));
    line.setAttribute("fill", "none"); line.setAttribute("stroke", s.color); line.setAttribute("stroke-width", "1.3");
    line.setAttribute("vector-effect", "non-scaling-stroke"); svg.append(line);
  }
  const axis = el("div", "axis");
  const daily = state.range !== "24h";
  const peak = Math.max(0, ...series.flatMap((s) => pts.map((p) => p[s.key] || 0)));
  if (pts.length) axis.append(el("span", null, when(pts[0].at, daily)), el("span", null, opts.fmt ? translate("기간 최고 {p0}", {p0: opts.fmt(peak)}) : ""), el("span", null, when(pts[pts.length - 1].at, daily)));
  box.append(legend, svg, axis);
  return box;
}
function heat() {
  const box = document.getElementById("heat"); box.replaceChildren();
  box.append(el("div"));
  for (let h = 0; h < 24; h++) box.append(el("div", null, h % 3 === 0 ? String(h) : ""));
  const cells = new Map((state.cells || []).map((c) => [`${c.dow}-${c.hour}`, c]));
  const values = (state.cells || []).map((c) => c[metric] || 0);
  const top = Math.max(1, ...values);
  for (let d = 0; d < 7; d++) {
    box.append(el("div", null, DOW()[d]));
    for (let h = 0; h < 24; h++) {
      const c = cells.get(`${d}-${h}`);
      const cell = el("div", "c");
      const v = c ? c[metric] : null;
      cell.style.background = v == null ? "var(--line)" : `rgba(88,166,255,${(0.12 + 0.88 * v / top).toFixed(2)})`;
      cell.title = c ? translate("{p0} {p1}시 · {p2} · 측정 {p3}번", {p0: DOW()[d], p1: h, p2: metric.startsWith("cpu") || metric === "memAvg" ? Math.round(v) + "%" : bytes(v, true), p3: c.samples}) : translate("{p0} {p1}시 · 기록 없음", {p0: DOW()[d], p1: h});
      box.append(cell);
    }
  }
  const best = [...(state.cells || [])].sort((a, b) => (b[metric] || 0) - (a[metric] || 0)).slice(0, 3);
  document.getElementById("heatnote").textContent = best.length
    ? translate("가장 높은 시간대: {p0} · 색이 진할수록 높음 · 칸에 마우스를 올리면 값", {p0: best.map((c) => translate("{p0} {p1}시", {p0: DOW()[c.dow], p1: c.hour})).join(", ")})
    : translate("아직 기록이 없습니다.");
}
function render(payload) {
  state = payload;
  if (!state) { document.getElementById("sub").textContent = translate("아직 측정값이 없습니다."); return; }
  const hostName = (state.hosts || []).find((h) => h.id === state.host)?.name || state.host;
  buttons("hosts", (state.hosts || []).map((h) => [h.id, h.name]), state.host, (host) => select({ host }));
  buttons("ranges", RANGES(), state.range, (range) => select({ range }));
  buttons("metrics", [["cpuAvg", translate("CPU 평균")], ["cpuMax", translate("CPU 최고")], ["memAvg", translate("메모리")], ["rxRate", translate("받기")], ["txRate", translate("보내기")]], metric, (m) => { metric = m; render(state); });
  if (state.error) { document.getElementById("sub").textContent = translate("불러오지 못했습니다: {p0}", {p0: state.error}); return; }
  const since = state.firstSampleAt ? new Date(state.firstSampleAt).toLocaleDateString(language === "en" ? "en-US" : "ko-KR") : "-";
  document.getElementById("sub").textContent = translate("{p0} · {p1} · 기록은 {p2}부터 쌓였습니다 · 5분마다 측정, 92일 보관 · 갱신 {p3}", {p0: hostName, p1: RANGES().find((r) => r[0] === state.range)?.[1], p2: since, p3: state.updated});
  const charts = document.getElementById("charts"); charts.replaceChildren();
  charts.append(
    chart("CPU", [{ key: "cpuMax", label: translate("최고"), color: "var(--accent2)" }, { key: "cpuAvg", label: translate("평균"), color: "var(--accent)" }], { max: 100, fmt: (v) => `${Math.round(v)}%` }),
    chart(translate("메모리"), [{ key: "memMax", label: translate("최고"), color: "var(--accent2)" }, { key: "memAvg", label: translate("평균"), color: "var(--accent)" }], { max: 100, fmt: (v) => `${Math.round(v)}%` }),
    chart(translate("네트워크"), [{ key: "rxRate", label: translate("받기"), color: "var(--accent)" }, { key: "txRate", label: translate("보내기"), color: "var(--accent2)" }], { fmt: (v) => bytes(v, true) }),
    chart(translate("디스크 (가장 찬 마운트)"), [{ key: "diskMax", label: translate("사용률"), color: "var(--warn)" }], { max: 100, fmt: (v) => `${Math.round(v)}%` }));
  heat();
  const peaks = document.getElementById("peaks"); peaks.replaceChildren();
  for (const p of state.peaks || []) { const tr = el("tr"); tr.append(el("td", null, when(p.at)), el("td", level(p.cpuMax), pct(p.cpuMax)), el("td", null, pct(p.cpuAvg)), el("td", null, pct(p.memAvg))); peaks.append(tr); }
  const net = document.getElementById("net"); net.replaceChildren();
  for (const p of state.busiestNet || []) { const tr = el("tr"); tr.append(el("td", null, when(p.at)), el("td", null, bytes(p.rxBytes)), el("td", null, bytes(p.txBytes))); net.append(tr); }
  const daily = state.rowSeconds >= 86400;
  document.getElementById("rowsTitle").textContent = daily ? translate("일별 요약") : translate("시간별 요약");
  const rows = document.getElementById("rows"); rows.replaceChildren();
  for (const r of state.rows || []) {
    const tr = el("tr");
    tr.append(el("td", null, when(r.at, daily)), el("td", level(r.cpuMax), `${pct(r.cpuAvg)} / ${pct(r.cpuMax)}`), el("td", level(r.memMax), `${pct(r.memAvg)} / ${pct(r.memMax)}`),
      el("td", level(r.diskMax, 85, 95), pct(r.diskMax)), el("td", null, bytes(r.rxBytes)), el("td", null, bytes(r.txBytes)), el("td", r.up < 1 ? "warn" : null, `${Math.round((r.up || 0) * 100)}%`));
    rows.append(tr);
  }
}
</script>
<script>
(() => {
  let next = 0;
  const pending = new Map();
  const { port1, port2 } = new MessageChannel();
  port1.onmessage = ({ data: m }) => {
    if (m.event === "theme") {
      for (const [k, v] of Object.entries(m.data.cssVars || {})) document.documentElement.style.setProperty(k, String(v));
      return;
    }
    if (m.event) return;
    const done = pending.get(m.id); pending.delete(m.id);
    if (done) done(m);
  };
  const request = (msg, post) => {
    const id = ++next;
    const reply = new Promise((resolve, reject) => pending.set(id, (m) => (m.error ? reject(m.error) : resolve(m.result))));
    post({ aoeBridge: 1, id, ...msg });
    return reply;
  };
  const call = (method, params) => request({ method, params }, (m) => port1.postMessage(m));
  window.bridgeCall = call;
  window.reload = () => load();
  window.el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  window.level = (v, warn = 80, bad = 92) => v == null ? "" : v >= bad ? "bad" : v >= warn ? "warn" : "ok";
  window.pct = (v) => v == null ? "-" : `${Math.round(v)}%`;
  async function load() {
    try {
      const body = await call("plugins.uiState");
      const entries = Array.isArray(body) ? body : body.entries || [];
      setLocale(entries);
      const mine = entries.find((e) => e.plugin_id === "dev.hyunwook.home-monitor" && e.slot === "page" && e.id === PAGE_ID);
      render(mine ? mine.payload : null);
    } catch (err) {
      document.getElementById("sub").textContent = translate("불러오지 못했습니다: {p0}", {p0: err.message || err.code || err});
    }
  }
  request({ method: "ready", params: { nonce: location.hash.slice(1) } }, (m) => parent.postMessage(m, "*", [port2])).then(load);
  setInterval(load, 30000);
})();
</script>
</body>
</html>
